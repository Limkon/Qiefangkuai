<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- 默认英文标题，检测到中文时由 JS 自动改为“切方块” -->
		<title>Menja</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<meta name="keywords" content="Menja, 切方块, 网页游戏" />
		<meta name="description" content="Menja 3D切方块游戏。" /> 
		<meta name="author" content="X(http://haiyong.site)" />
		<meta name="copyright" content="X(http://haiyong.site)" />
		<link rel="icon" href="http://haiyong.site/wp-content/uploads/2021/07/cropped-59255587-1-192x192.jpg" sizes="192x192" />
		<link rel="stylesheet" href="css/style.css"/>
		<script>
            var _hmt = _hmt || [];
            (function() {
            var hm = document.createElement("script");
            hm.src = "https://hm.baidu.com/hm.js?a9430a37066911650e26adadcc42798a";
            var s = document.getElementsByTagName("script")[0]; 
            s.parentNode.insertBefore(hm, s);
            })();
        </script>
	</head>
	<body>
		<!-- Game canvas -->
		<canvas id="c"></canvas>
		
		<!-- Gameplay HUD -->
		<div class="hud">
			<div class="hud__score">
				<div class="score-lbl"></div>
				<div class="cube-count-lbl"></div>
			</div>
			<div class="pause-btn"><div></div></div>
			<div class="slowmo">
				<div class="slowmo__bar"></div>
			</div>
		</div>
		
		<!-- Menu System -->
		<div class="menus">
			<!-- 主菜单 -->
			<div class="menu menu--main">
				<h1 class="main-title">MENJA</h1>
				<button type="button" class="play-normal-btn">Play Normal</button>
				<button type="button" class="play-casual-btn">Play Casual</button>
				<div class="credits">An 8KB Game by <a href="http://haiyong.site/index" target="_blank">X</a><br><br>
					<a href="http://haiyong.site/moyu" target="_blank">More Games</a>
				</div>
			</div>

			<!-- 暂停菜单 -->
			<div class="menu menu--pause">
				<h1 class="pause-title">PAUSED</h1>
				<button type="button" class="resume-btn">Resume</button>
				<button type="button" class="menu-btn--pause">Main Menu</button>
			</div>

			<!-- 结算菜单 -->
			<div class="menu menu--score">
				<h1 class="gameover-title">GAME OVER</h1>
				<h2 class="your-score-lbl">YOUR SCORE:</h2>
				<div class="final-score-lbl">0</div>
				<div class="high-score-lbl"></div>
				<button type="button" class="play-again-btn">Play Again</button>
				<button type="button" class="menu-btn--score">Main Menu</button>
			</div>
		</div>
	</body>
	<script src="js/script.js"></script>
</html>
